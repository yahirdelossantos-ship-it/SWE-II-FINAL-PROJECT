		<ellipse cx="695" cy="124" rx="199" ry="36"/>
		<ellipse cx="695" cy="218" rx="199" ry="36"/>
		<ellipse cx="695" cy="312" rx="199" ry="36"/>
		<ellipse cx="695" cy="406" rx="199" ry="36"/>
	</g>
	<g fill="#0f172a" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
		<text x="695" y="58" font-size="22" font-weight="bold">Gestión del itinerario de traslados</text>
		<text x="104" y="161">Coordinador</text>
		<text x="104" y="264">Administrador</text>
