<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="510" viewBox="0 0 1020 510" role="img" aria-labelledby="titulo descripcion">
	<title id="titulo">Anexo A.1. Diagrama de casos de uso</title>
	<desc id="descripcion">El encargado de operaciones, el coordinador y el administrador son empleados. Los empleados pueden gestionar su sesión y consultar el itinerario. El encargado de operaciones también registra traslados y actualiza la hora de recogida en el flujo documentado.</desc>
