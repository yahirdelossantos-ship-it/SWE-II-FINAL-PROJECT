	<g fill="none" stroke="#334155" stroke-width="1.7">
		<path d="M119 107H206V347 M119 210H206 M119 347H206"/>
		<path d="M206 161H282" marker-end="url(#generalizacion)"/>
		<path d="M312 161L496 124 M312 161L496 218 M115 374L496 312 M115 374L496 406"/>
	</g>
