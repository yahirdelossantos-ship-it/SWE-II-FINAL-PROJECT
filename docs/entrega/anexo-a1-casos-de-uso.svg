			<path d="M0 -12V13 M-15 -1H15 M0 13L-13 30 M0 13L13 30"/>
		</g>
		<marker id="generalizacion" markerWidth="13" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
			<path d="M1 1L12 7L1 13Z" fill="white" stroke="#334155" stroke-width="1.5"/>
		</marker>
	</defs>
	<rect width="1020" height="510" fill="white"/>
